# BLE central, GATT client, pairing, bonding, and persistent keys
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_DEVICE_NAME="Canon Remote"
CONFIG_BT_SMP_SC_PAIR_ONLY=n
CONFIG_BT_SMP_ENFORCE_MITM=n
CONFIG_BT_CREATE_CONN_TIMEOUT=15
CONFIG_BT_ATT_TX_COUNT=4
CONFIG_BT_CONN_CHECK_NULL_BEFORE_CREATE=y

# Zephyr settings store
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Product power behavior
CONFIG_CANON_POWER_SAVE=y
CONFIG_CANON_POWER_IDLE_TIMEOUT_SECONDS=30
CONFIG_POWEROFF=y

# Product firmware has no interactive shell or serial logging.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SHELL=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n

CONFIG_REBOOT=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
