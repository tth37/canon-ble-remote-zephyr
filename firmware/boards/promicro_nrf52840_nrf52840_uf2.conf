# USB CDC serial shell
CONFIG_BT_DEVICE_NAME="nRF52840 Remote"
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y

# Canon requires identity-key distribution but reconnects using a fixed address.
CONFIG_BT_PRIVACY=y
CONFIG_CANON_REMOTE_FIXED_IDENTITY=y

# Permit Zephyr's NVS settings backend to write internal flash.
CONFIG_MPU_ALLOW_FLASH_WRITE=y
