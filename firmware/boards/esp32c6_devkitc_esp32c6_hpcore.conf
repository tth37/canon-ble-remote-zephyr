# The DevKitC routes Zephyr's shell and console through UART0 at 115200 baud.
# Espressif's Bluetooth controller is selected automatically by Devicetree.
CONFIG_BT_DEVICE_NAME="ESP32C6 Remote"

# 128x64 SSD1306 status display on I2C0.
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=n
CONFIG_I2C_SHELL=y

# Onboard addressable RGB LED on GPIO8.
CONFIG_LED_STRIP=y
